<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="tgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e4e8ef" stroke-width="0.5"/>
    </pattern>
    <filter id="tshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a2e" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="tgrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5c7a"/>
      <stop offset="100%" stop-color="#ff7a94"/>
    </linearGradient>
    <linearGradient id="tgrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f84d8"/>
      <stop offset="100%" stop-color="#62b6f3"/>
    </linearGradient>
    <linearGradient id="tgrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#59c982"/>
      <stop offset="100%" stop-color="#8ee8a0"/>
    </linearGradient>
    <linearGradient id="tgrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ffe29a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#f8f9fa"/>
  <rect width="1200" height="320" fill="url(#tgrid)"/>

  <!-- Header accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#tgrad1)"/>

  <!-- Title area -->
  <text x="60" y="55" font-family="system-ui" font-size="11" font-weight="700" fill="#ff5c7a" letter-spacing="0.1em">PLANNING TOOLS</text>
  <text x="60" y="90" font-family="system-ui" font-size="36" font-weight="900" fill="#1a1a2e">Build Your Route, Team &amp; Recipes</text>
  <text x="60" y="120" font-family="system-ui" font-size="14" fill="#8b95a8">Pick a goal · Compare data · Open linked pages · Execute the plan</text>

  <!-- Tool Card 1: Habitat Planner -->
  <g filter="url(#tshadow)" transform="translate(60, 145)">
    <rect width="240" height="145" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="240" height="6" rx="3" fill="url(#tgrad1)"/>
    <g transform="translate(24, 28)">
      <!-- Map icon -->
      <rect width="44" height="44" rx="8" fill="rgba(255,92,122,0.08)"/>
      <g transform="translate(22, 22)">
        <path d="M-10 -8 L0 -4 L10 -8 L10 8 L0 4 L-10 8Z" fill="none" stroke="#ff5c7a" stroke-width="2" stroke-linejoin="round"/>
        <path d="M0 -4 v12" stroke="#ff5c7a" stroke-width="2"/>
        <path d="M-10 -8 v16 L0 4 v-12z" fill="rgba(255,92,122,0.15)"/>
      </g>
    </g>
    <text x="84" y="52" font-family="system-ui" font-size="11" font-weight="800" fill="#1a1a2e">Habitat Planner</text>
    <text x="84" y="68" font-family="system-ui" font-size="9" fill="#8b95a8">Route builder</text>
    <line x1="24" y1="82" x2="216" y2="82" stroke="#e4e8ef" stroke-width="1"/>
    <text x="24" y="100" font-family="system-ui" font-size="9" fill="#5c6677">Outputs:</text>
    <text x="24" y="116" font-family="system-ui" font-size="9" fill="#5c6677">Route match · Recommended recipe</text>
    <text x="24" y="132" font-family="system-ui" font-size="9" fill="#5c6677">Pokemon spawns · Related guides</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(310, 205)">
    <path d="M0 5 L16 5 M10 0 L16 5 L10 10" fill="none" stroke="#e4e8ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tool Card 2: Recipe Calculator -->
  <g filter="url(#tshadow)" transform="translate(340, 145)">
    <rect width="240" height="145" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="240" height="6" rx="3" fill="url(#tgrad2)"/>
    <g transform="translate(24, 28)">
      <!-- Recipe/buff icon -->
      <rect width="44" height="44" rx="8" fill="rgba(47,132,216,0.08)"/>
      <g transform="translate(22, 22)">
        <path d="M-10 -6 L10 -6 L6 6 L-6 6Z" fill="none" stroke="#2f84d8" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="3.5" fill="#2f84d8"/>
      </g>
    </g>
    <text x="84" y="52" font-family="system-ui" font-size="11" font-weight="800" fill="#1a1a2e">Recipe Calculator</text>
    <text x="84" y="68" font-family="system-ui" font-size="9" fill="#8b95a8">Compare &amp; plan</text>
    <line x1="24" y1="82" x2="216" y2="82" stroke="#e4e8ef" stroke-width="1"/>
    <text x="24" y="100" font-family="system-ui" font-size="9" fill="#5c6677">Outputs:</text>
    <text x="24" y="116" font-family="system-ui" font-size="9" fill="#5c6677">Goal match · Use timing</text>
    <text x="24" y="132" font-family="system-ui" font-size="9" fill="#5c6677">Common mistakes · Planning links</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(590, 205)">
    <path d="M0 5 L16 5 M10 0 L16 5 L10 10" fill="none" stroke="#e4e8ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tool Card 3: Team Builder -->
  <g filter="url(#tshadow)" transform="translate(620, 145)">
    <rect width="240" height="145" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="240" height="6" rx="3" fill="url(#tgrad3)"/>
    <g transform="translate(24, 28)">
      <!-- Team/group icon -->
      <rect width="44" height="44" rx="8" fill="rgba(89,201,130,0.08)"/>
      <g transform="translate(22, 22)">
        <circle cx="-8" cy="-4" r="5" fill="none" stroke="#59c982" stroke-width="2"/>
        <circle cx="8" cy="-4" r="5" fill="none" stroke="#59c982" stroke-width="2"/>
        <path d="M-14 8 C-14 3 -4 1 -4 1" fill="none" stroke="#59c982" stroke-width="2" stroke-linecap="round"/>
        <path d="M14 8 C14 3 4 1 4 1" fill="none" stroke="#59c982" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="4" r="5" fill="none" stroke="#59c982" stroke-width="2"/>
      </g>
    </g>
    <text x="84" y="52" font-family="system-ui" font-size="11" font-weight="800" fill="#1a1a2e">Team Builder</text>
    <text x="84" y="68" font-family="system-ui" font-size="9" fill="#8b95a8">Role draft</text>
    <line x1="24" y1="82" x2="216" y2="82" stroke="#e4e8ef" stroke-width="1"/>
    <text x="24" y="100" font-family="system-ui" font-size="9" fill="#5c6677">Outputs:</text>
    <text x="24" y="116" font-family="system-ui" font-size="9" fill="#5c6677">Lead role · Damage role</text>
    <text x="24" y="132" font-family="system-ui" font-size="9" fill="#5c6677">Support role · Survival role</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(870, 205)">
    <path d="M0 5 L16 5 M10 0 L16 5 L10 10" fill="none" stroke="#e4e8ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tool Card 4: Spawn Tracker -->
  <g filter="url(#tshadow)" transform="translate(900, 145)">
    <rect width="240" height="145" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="240" height="6" rx="3" fill="url(#tgrad4)"/>
    <g transform="translate(24, 28)">
      <!-- Tracker/search icon -->
      <rect width="44" height="44" rx="8" fill="rgba(255,209,102,0.1)"/>
      <g transform="translate(22, 22)">
        <circle cx="-3" cy="-3" r="9" fill="none" stroke="#b45309" stroke-width="2"/>
        <path d="M4 4 L12 12" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
        <path d="M-8 0 L-3 -5" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </g>
    </g>
    <text x="84" y="52" font-family="system-ui" font-size="11" font-weight="800" fill="#1a1a2e">Spawn Tracker</text>
    <text x="84" y="68" font-family="system-ui" font-size="9" fill="#8b95a8">Filter &amp; track</text>
    <line x1="24" y1="82" x2="216" y2="82" stroke="#e4e8ef" stroke-width="1"/>
    <text x="24" y="100" font-family="system-ui" font-size="9" fill="#5c6677">Filters:</text>
    <text x="24" y="116" font-family="system-ui" font-size="9" fill="#5c6677">Habitat · Weather · Time</text>
    <text x="24" y="132" font-family="system-ui" font-size="9" fill="#5c6677">Rarity · Type · Food</text>
  </g>
</svg>
