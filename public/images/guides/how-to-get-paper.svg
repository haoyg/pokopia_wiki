      <stop offset="50%" style="stop-color:hsl(100,55%,22%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(240,50%,12%);stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="60" x2="60" y2="60" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="60" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="20%" cy="25%" r="55%">
