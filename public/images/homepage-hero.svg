<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e4e8ef" stroke-width="0.5"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft shadow for cards -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a2e" flood-opacity="0.12"/>
    </filter>
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5c7a"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f84d8"/>
      <stop offset="100%" stop-color="#59c982"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#f8f9fa"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Left side: text area accent -->
  <rect x="0" y="0" width="8" height="400" fill="url(#accentGrad)"/>

  <!-- Decorative large circle (background element) -->
  <circle cx="900" cy="200" r="280" fill="#2f84d8" opacity="0.04"/>
  <circle cx="300" cy="100" r="180" fill="#ff5c7a" opacity="0.04"/>

  <!-- Pokemon card grid — left area (representative sample) -->
  <!-- Card 1 — Fire type -->
  <g filter="url(#cardShadow)" transform="translate(40, 40)">
    <rect width="120" height="140" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="120" height="8" rx="8" fill="#ff6b35"/>
    <rect y="8" width="120" height="8" fill="#ff6b35"/>
    <!-- Flame icon -->
    <g transform="translate(60, 70)">
      <path d="M0 20 C-8 10 -4 -5 0 -15 C4 -5 8 10 0 20Z" fill="#ff6b35"/>
      <path d="M-3 18 C-8 10 -5 0 -2 -10 C1 0 4 10 -3 18Z" fill="#ffd166" opacity="0.8"/>
    </g>
    <text x="60" y="118" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#1a1a2e">Flamexor</text>
    <text x="60" y="130" text-anchor="middle" font-family="system-ui" font-size="7" fill="#8b95a8">Fire · Rare</text>
  </g>

  <!-- Card 2 — Water type -->
  <g filter="url(#cardShadow)" transform="translate(175, 40)">
    <rect width="120" height="140" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="120" height="8" rx="8" fill="#3b82f6"/>
    <rect y="8" width="120" height="8" fill="#3b82f6"/>
    <!-- Water drop icon -->
    <g transform="translate(60, 70)">
      <path d="M0 -15 C-14 5 -8 20 0 20 C8 20 14 5 0 -15Z" fill="#3b82f6"/>
      <ellipse cx="-4" cy="5" rx="4" ry="6" fill="white" opacity="0.3" transform="rotate(-20, -4, 5)"/>
    </g>
    <text x="60" y="118" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#1a1a2e">Aquap</text>
    <text x="60" y="130" text-anchor="middle" font-family="system-ui" font-size="7" fill="#8b95a8">Water · Common</text>
  </g>

  <!-- Card 3 — Grass type -->
  <g filter="url(#cardShadow)" transform="translate(40, 200)">
    <rect width="120" height="140" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="120" height="8" rx="8" fill="#22c55e"/>
    <rect y="8" width="120" height="8" fill="#22c55e"/>
    <!-- Leaf icon -->
    <g transform="translate(60, 70)">
      <path d="M0 -18 C12 -10 15 8 0 18 C-15 8 -12 -10 0 -18Z" fill="#22c55e"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#15803d" stroke-width="1.5" opacity="0.6"/>
    </g>
    <text x="60" y="118" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#1a1a2e">Leafon</text>
    <text x="60" y="130" text-anchor="middle" font-family="system-ui" font-size="7" fill="#8b95a8">Grass · Common</text>
  </g>

  <!-- Card 4 — Electric type -->
  <g filter="url(#cardShadow)" transform="translate(175, 200)">
    <rect width="120" height="140" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1"/>
    <rect width="120" height="8" rx="8" fill="#fbbf24"/>
    <rect y="8" width="120" height="8" fill="#fbbf24"/>
    <!-- Lightning bolt icon -->
    <g transform="translate(60, 68)">
      <polygon points="-6,-18 4,-6 0,-6 6,18 -4,6 0,6" fill="#fbbf24"/>
      <polygon points="-3,-12 2,-4 0,-4 3,12 -2,4 0,4" fill="white" opacity="0.4"/>
    </g>
    <text x="60" y="118" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#1a1a2e">Zaprat</text>
    <text x="60" y="130" text-anchor="middle" font-family="system-ui" font-size="7" fill="#8b95a8">Electric · Uncommon</text>
  </g>

  <!-- Center decorative divider -->
  <rect x="320" y="60" width="2" height="280" rx="1" fill="url(#accentGrad)" opacity="0.3"/>

  <!-- Center content: section labels -->
  <g transform="translate(340, 80)">
    <!-- Section icons row -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1" filter="url(#cardShadow)"/>
      <!-- Database icon -->
      <g transform="translate(24, 24)">
        <ellipse rx="12" ry="6" fill="none" stroke="#ff5c7a" stroke-width="2"/>
        <path d="M-12 0 v6 c0 3.3 5.4 6 12 6 s12 -2.7 12 -6 v-6" fill="none" stroke="#ff5c7a" stroke-width="2"/>
        <path d="M-12 12 v6 c0 3.3 5.4 6 12 6 s12 -2.7 12 -6 v-6" fill="none" stroke="#ff5c7a" stroke-width="2"/>
      </g>
    </g>

    <g transform="translate(70, 0)">
      <rect width="48" height="48" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1" filter="url(#cardShadow)"/>
      <!-- Map icon -->
      <g transform="translate(24, 24)">
        <path d="M-12 -8 L0 -4 L12 -8 L12 8 L0 4 L-12 8Z" fill="none" stroke="#2f84d8" stroke-width="2" stroke-linejoin="round"/>
        <path d="M0 -4 v12" stroke="#2f84d8" stroke-width="2"/>
        <path d="M-12 -8 v16 L0 12 v-16z" fill="#2f84d8" opacity="0.2"/>
      </g>
    </g>

    <g transform="translate(140, 0)">
      <rect width="48" height="48" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1" filter="url(#cardShadow)"/>
      <!-- Recipe/buff icon -->
      <g transform="translate(24, 24)">
        <path d="M-10 -6 L10 -6 L6 6 L-6 6Z" fill="none" stroke="#59c982" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="3" fill="#59c982"/>
      </g>
    </g>

    <g transform="translate(210, 0)">
      <rect width="48" height="48" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1" filter="url(#cardShadow)"/>
      <!-- Tools/wrench icon -->
      <g transform="translate(24, 24)">
        <path d="M-4 8 L4 -8 L8 -4 L0 8Z" fill="#ffd166" stroke="#b45309" stroke-width="1.5"/>
        <path d="M-4 -4 C-10 -10 -14 -6 -8 0 C-6 2 -4 4 -4 8" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <g transform="translate(280, 0)">
      <rect width="48" height="48" rx="8" fill="white" stroke="#e4e8ef" stroke-width="1" filter="url(#cardShadow)"/>
      <!-- News/newspaper icon -->
      <g transform="translate(24, 24)">
        <rect x="-10" y="-10" width="20" height="20" rx="2" fill="none" stroke="#8b5cf6" stroke-width="2"/>
        <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#8b5cf6" stroke-width="2"/>
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#8b5cf6" stroke-width="2"/>
        <line x1="-6" y1="4" x2="2" y2="4" stroke="#8b5cf6" stroke-width="2"/>
      </g>
    </g>

    <!-- Labels -->
    <text x="24" y="68" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#1a1a2e">50+ Pokemon</text>
    <text x="94" y="68" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#1a1a2e">20 Habitats</text>
    <text x="164" y="68" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#1a1a2e">15 Recipes</text>
    <text x="234" y="68" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#1a1a2e">4 Tools</text>
    <text x="304" y="68" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#1a1a2e">News &amp; Guides</text>
  </g>

  <!-- Stats bar -->
  <g transform="translate(340, 175)">
    <rect width="520" height="1" rx="0.5" fill="#e4e8ef"/>
    <text x="0" y="30" font-family="system-ui" font-size="11" font-weight="800" fill="#1a1a2e" letter-spacing="0.05em">POKOPIA PORTAL — YOUR GAME REFERENCE</text>
    <text x="0" y="50" font-family="system-ui" font-size="10" fill="#8b95a8">Independent wiki · Source-verified content · Updated for current patch</text>
  </g>

  <!-- Right side: decorative badge/ribbon -->
  <g transform="translate(900, 40)">
    <rect width="260" height="320" rx="10" fill="white" stroke="#e4e8ef" stroke-width="1" filter="url(#cardShadow)"/>
    <!-- Top color bar -->
    <rect width="260" height="48" rx="10" fill="url(#accentGrad)"/>
    <rect y="38" width="260" height="10" fill="url(#accentGrad)"/>
    <!-- Pokeball-style icon -->
    <g transform="translate(130, 24)">
      <circle r="16" fill="white" opacity="0.25"/>
      <circle r="10" fill="white" opacity="0.5"/>
      <circle r="5" fill="white"/>
    </g>
    <!-- Content -->
    <text x="130" y="80" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#8b95a8" letter-spacing="0.1em">WIKI DATABASE</text>
    <text x="130" y="105" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="900" fill="#1a1a2e">Pokopedia</text>
    <text x="130" y="125" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8b95a8">Complete Reference</text>

    <line x1="30" y1="145" x2="230" y2="145" stroke="#e4e8ef" stroke-width="1"/>

    <!-- Mini stat rows -->
    <g transform="translate(30, 160)">
      <circle r="4" fill="#ff5c7a" opacity="0.8"/>
      <text x="14" y="4" font-family="system-ui" font-size="10" font-weight="600" fill="#1a1a2e">Pokemon Database</text>
      <text x="200" y="4" font-family="system-ui" font-size="10" font-weight="700" fill="#ff5c7a" text-anchor="end">50+ entries</text>
    </g>
    <g transform="translate(30, 185)">
      <circle r="4" fill="#2f84d8" opacity="0.8"/>
      <text x="14" y="4" font-family="system-ui" font-size="10" font-weight="600" fill="#1a1a2e">Habitat Routes</text>
      <text x="200" y="4" font-family="system-ui" font-size="10" font-weight="700" fill="#2f84d8" text-anchor="end">20 routes</text>
    </g>
    <g transform="translate(30, 210)">
      <circle r="4" fill="#59c982" opacity="0.8"/>
      <text x="14" y="4" font-family="system-ui" font-size="10" font-weight="600" fill="#1a1a2e">Recipes &amp; Crafting</text>
      <text x="200" y="4" font-family="system-ui" font-size="10" font-weight="700" fill="#59c982" text-anchor="end">15 recipes</text>
    </g>
    <g transform="translate(30, 235)">
      <circle r="4" fill="#ffd166" opacity="0.8"/>
      <text x="14" y="4" font-family="system-ui" font-size="10" font-weight="600" fill="#1a1a2e">Planning Tools</text>
      <text x="200" y="4" font-family="system-ui" font-size="10" font-weight="700" fill="#b45309" text-anchor="end">4 tools</text>
    </g>
    <g transform="translate(30, 260)">
      <circle r="4" fill="#8b5cf6" opacity="0.8"/>
      <text x="14" y="4" font-family="system-ui" font-size="10" font-weight="600" fill="#1a1a2e">Guides &amp; News</text>
      <text x="200" y="4" font-family="system-ui" font-size="10" font-weight="700" fill="#8b5cf6" text-anchor="end">30+ pages</text>
    </g>

    <!-- Bottom CTA -->
    <rect x="30" y="285" width="200" height="28" rx="4" fill="url(#blueGrad)"/>
    <text x="130" y="304" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="white">Browse Pokemon →</text>
  </g>

  <!-- Bottom decorative wave/line -->
  <path d="M0 395 Q150 385 300 395 Q450 405 600 395 Q750 385 900 395 Q1050 405 1200 395 L1200 400 L0 400Z" fill="#2f84d8" opacity="0.06"/>
</svg>
