<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ig" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ig2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="ish" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0891b2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#ish)">
    <!-- Snowflake arms -->
    <line x1="32" y1="6" x2="32" y2="58" stroke="url(#ig)" stroke-width="5" stroke-linecap="round"/>
    <line x1="6" y1="32" x2="58" y2="32" stroke="url(#ig)" stroke-width="5" stroke-linecap="round"/>
    <line x1="13" y1="13" x2="51" y2="51" stroke="url(#ig)" stroke-width="5" stroke-linecap="round"/>
    <line x1="51" y1="13" x2="13" y2="51" stroke="url(#ig)" stroke-width="5" stroke-linecap="round"/>
    <!-- Inner crystal detail -->
    <circle cx="32" cy="32" r="10" fill="url(#ig2)" opacity="0.6"/>
    <!-- Tip decorations -->
    <circle cx="32" cy="6" r="3.5" fill="#ecfeff"/>
    <circle cx="32" cy="58" r="3.5" fill="#ecfeff"/>
    <circle cx="6" cy="32" r="3.5" fill="#ecfeff"/>
    <circle cx="58" cy="32" r="3.5" fill="#ecfeff"/>
    <circle cx="13" cy="13" r="3" fill="#ecfeff"/>
    <circle cx="51" cy="51" r="3" fill="#ecfeff"/>
    <circle cx="51" cy="13" r="3" fill="#ecfeff"/>
    <circle cx="13" cy="51" r="3" fill="#ecfeff"/>
    <!-- Center gem -->
    <circle cx="32" cy="32" r="5" fill="#ecfeff" opacity="0.8"/>
  </g>
</svg>
