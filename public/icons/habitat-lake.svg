<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lkg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lkg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="lksh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0369a1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#lksh)">
    <!-- Lake water -->
    <ellipse cx="32" cy="42" rx="26" ry="14" fill="url(#lkg)"/>
    <!-- Water surface ripples -->
    <ellipse cx="32" cy="40" rx="20" ry="9" fill="url(#lkg2)" opacity="0.4"/>
    <ellipse cx="32" cy="38" rx="14" ry="6" fill="#f0f9ff" opacity="0.3"/>
    <!-- Sun -->
    <circle cx="48" cy="16" r="8" fill="#fef9c3" opacity="0.85"/>
    <!-- Sun rays -->
    <g stroke="#fef9c3" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <line x1="48" y1="4" x2="48" y2="8"/>
      <line x1="56" y1="8" x2="53" y2="11"/>
      <line x1="60" y1="16" x2="56" y2="16"/>
      <line x1="40" y1="8" x2="43" y2="11"/>
      <line x1="36" y1="16" x2="40" y2="16"/>
    </g>
    <!-- Shoreline -->
    <path d="M6 46 Q18 38 32 44 Q46 50 58 44" fill="none" stroke="#4ade80" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  </g>
</svg>
