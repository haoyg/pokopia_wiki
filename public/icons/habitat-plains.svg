    <line x1="44" y1="30" x2="52" y2="38" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="30" x2="36" y2="38" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="30" x2="52" y2="22" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="44" cy="30" r="3" fill="#64748b"/>
    <!-- Tree -->
    <path d="M18 56 L18 40 M12 44 L18 36 L24 44" stroke="url(#plg2)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="18" cy="34" rx="7" ry="8" fill="url(#plg)"/>
    <!-- Flowers -->
    <circle cx="30" cy="50" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="38" cy="48" r="2.5" fill="#f472b6" opacity="0.7"/>
