<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#ff5c7a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#2f84d8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2f84d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="90%" r="35%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5c7a"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#59c982"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a94"/>
      <stop offset="100%" stop-color="#ff5c7a"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1e2e"/>

  <!-- Glow layers -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Subtle grid texture -->
  <line x1="0" y1="157" x2="1200" y2="157" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="314" x2="1200" y2="314" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="471" x2="1200" y2="471" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative circles (top right) -->
  <circle cx="1020" cy="130" r="90" fill="none" stroke="#ff5c7a" stroke-width="2" opacity="0.35"/>
  <circle cx="1020" cy="130" r="60" fill="none" stroke="#ffd166" stroke-width="2" opacity="0.3"/>
  <circle cx="1020" cy="130" r="30" fill="#ff5c7a" opacity="0.2"/>

  <!-- Decorative circles (bottom left) -->
  <circle cx="180" cy="500" r="110" fill="none" stroke="#2f84d8" stroke-width="2" opacity="0.3"/>
  <circle cx="180" cy="500" r="75" fill="none" stroke="#59c982" stroke-width="2" opacity="0.25"/>
  <circle cx="180" cy="500" r="40" fill="#2f84d8" opacity="0.15"/>

  <!-- Accent bar left -->
  <rect x="80" y="220" width="6" height="180" rx="3" fill="url(#wordGrad)" filter="url(#softGlow)"/>

  <!-- Main title -->
  <text x="116" y="305" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="108" font-weight="900" fill="#ffffff" letter-spacing="8">POKOPIA</text>

  <!-- Subtitle -->
  <text x="116" y="378" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="800" fill="url(#wordGrad)" letter-spacing="14">PORTAL</text>

  <!-- Tagline -->
  <text x="116" y="448" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#8b97a8" letter-spacing="1">Guides • Pokemon Database • Habitat Maps • Recipes • Tools</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#barGrad)"/>

  <!-- Bar label -->
  <text x="600" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fffdf7" letter-spacing="3" opacity="0.9">INDEPENDENT POKOPIA REFERENCE</text>

  <!-- Pokeball mark (top right decorative) -->
  <g transform="translate(940, 80)">
    <circle cx="60" cy="60" r="50" fill="#ff5c7a" opacity="0.15"/>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#ff5c7a" stroke-width="3" opacity="0.4"/>
    <circle cx="60" cy="60" r="14" fill="#ffd166" opacity="0.5"/>
  </g>
</svg>
